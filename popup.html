<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
    }
    h2 {
      margin: 0 0 15px 0;
      font-size: 16px;
      color: #333;
    }
    .switch-container {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
      margin-bottom: 10px;
    }
    .switch-container input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      transition: background-color 0.4s;
      border-radius: 34px;
    }
    .slider::before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: transform 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2ecc71;
    }
    input:focus + .slider {
      box-shadow: 0 0 1px #2ecc71;
    }
    input:checked + .slider::before {
      transform: translateX(26px);
    }
    #status-text {
      font-weight: bold;
      font-size: 14px;
      margin-top: 5px;
      color: #555;
    }
    .note {
      font-size: 10px;
      color: #888;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h2>Ninja Ad (Stealth)</h2>

  <label class="switch-container">
    <input type="checkbox" id="toggle-switch">
    <span class="slider"></span>
  </label>

  <div id="status-text">読み込み中...</div>
  <div class="note">※変更後はページを<br>リロードしてください</div>

  <script src="popup.js"></script>
</body>
</html>
